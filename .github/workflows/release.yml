name: Publicar versión multiplataforma

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Construir macOS ARM64
    runs-on: macos-14
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: arm64
          cache: pip

      - name: Construir DMG
        env:
          PYTHON_BIN: python
        run: ./build_macos.sh

      - name: Guardar artefacto macOS
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/macos/Programador-de-alarmas.dmg
          if-no-files-found: error

  build-linux:
    name: Construir Linux x64
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar Tkinter
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: Construir paquete Linux
        env:
          PYTHON_BIN: python
        run: ./build_linux.sh

      - name: Guardar artefacto Linux
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/linux/Programador-de-alarmas-linux.tar.gz
          if-no-files-found: error

  build-windows:
    name: Construir Windows x64
    runs-on: windows-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Construir ejecutable Windows
        shell: pwsh
        run: ./build_windows.ps1

      - name: Guardar artefacto Windows
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/windows/Programador-de-alarmas.exe
          if-no-files-found: error

  publish-release:
    name: Publicar GitHub Release
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux, build-windows]
    steps:
      - name: Descargar ejecutables
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Crear la Release y adjuntar ejecutables
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Programador de alarmas $GITHUB_REF_NAME" \
              --generate-notes
          fi
